name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared test and runtime dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test,runtime]"

      - name: Run offline-only checks
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/validate_step1_specs.py
          python -m pytest -o addopts="" -p no:cacheprovider -q
          python scripts/package_skill.py --check
          python scripts/freeze_v4_runtime_spec.py --check
          python scripts/propose_v4.py --check
          python scripts/qualification_workflow.py examples/qualification/eop101132-request.json --json
          python scripts/evaluate_qualification.py --json
          python scripts/build_corpus_manifest.py --check
          python scripts/build_evaluation_corpus.py --check
          python scripts/build_retrieval_benchmark.py --check
          python scripts/evaluate_retrieval.py --json
          python scripts/run_e2e_demos.py --json
          python scripts/evaluate_security.py --json
          python scripts/evaluate_model_comparisons.py --json
          python scripts/audit_git_baseline.py --json
