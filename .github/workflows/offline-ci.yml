name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Install declared test and runtime dependencies
        run: uv sync --locked --no-install-project --extra test --extra runtime --python 3.14

      - name: Run offline-only checks
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          .venv/bin/python scripts/validate_step1_specs.py
          .venv/bin/python -m pytest -o addopts="" -p no:cacheprovider -q
          .venv/bin/python scripts/package_skill.py --check
          .venv/bin/python scripts/freeze_v4_runtime_spec.py --check
          .venv/bin/python scripts/propose_v4.py --check
          .venv/bin/python scripts/qualification_workflow.py examples/qualification/eop101132-request.json --json
          .venv/bin/python scripts/evaluate_qualification.py --json
          .venv/bin/python scripts/build_corpus_manifest.py --check
          .venv/bin/python scripts/build_evaluation_corpus.py --check
          .venv/bin/python scripts/build_retrieval_benchmark.py --check
          .venv/bin/python scripts/evaluate_retrieval.py --json
          .venv/bin/python scripts/run_e2e_demos.py --json
          .venv/bin/python scripts/evaluate_security.py --json
          .venv/bin/python scripts/evaluate_model_comparisons.py --json
          .venv/bin/python scripts/audit_git_baseline.py --json
