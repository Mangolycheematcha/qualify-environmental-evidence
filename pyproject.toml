[project]
name = "qualify-environmental-evidence"
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
]
runtime = [
  "numpy==2.5.2; python_version >= '3.12'",
  "rasterio==1.5.1; python_version >= '3.12'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
